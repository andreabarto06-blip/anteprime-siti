<link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Anteprime di siti</title>
<script>
// A link copied with stray characters (markdown **, dots, quotes, brackets, %2A) lands here:
// strip them and, if what is left names a known preview folder, go there.
(function () {
  var sites = ["il-bisogno", "pizzeria-jonica", "la-sorgente", "esteticamente-gisella", "gregori-cerutti", "kreuzberg", "tirabaci", "format-chieri", "sushi-del-masle", "rosa-bianca", "cube-chieri", "don-raffaele", "dmedical-chieri", "agrigrill-cascina-capello", "cantina-del-convento", "la-bufala-nera", "trattoria-delle-erbe", "todra-chieri", "old-building-chieri"];
  var base = "/anteprime-siti/";
  var path = decodeURIComponent(location.pathname).toLowerCase();
  var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, "");
  var first = rest.split("/")[0].replace(/[^a-z0-9-]/g, "");
  var hit = sites.filter(function (s) { return first === s || first === s.replace(/-/g, ""); })[0];
  if (hit && location.pathname.toLowerCase() !== base + hit + "/") location.replace(base + hit + "/" + location.hash);
})();
</script>
